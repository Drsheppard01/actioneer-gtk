[package]
name = "actioneer"
version = "0.1.0"
edition = "2021"
authors = ["Actioneer Contributors"]
description = "GitHub Actions client for Linux (GNOME)"
license = "MIT"

[dependencies]
# GTK4 and libadwaita
gtk4 = { version = "0.9", package = "gtk4" }
libadwaita = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
gio = "0.20"

# HTTP client and async runtime
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Secret storage
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

# DBus and portals
zbus = "4.4"

# Open URLs
open = "5.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
dirs = "5.0"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["clock"] }
notify-rust = "4.10.0"
parking_lot = "0.12"

[dev-dependencies]
# Testing HTTP mocks
wiremock = "0.6"
tokio-test = "0.4"
