name: RPM Package CI

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      run-id:
        description: GitHub run id that produced the RPM package artifacts
        value: ${{ jobs.build.outputs.run-id }}

jobs:
  build:
    name: Build RPM (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            nfpm_arch: x86_64
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            nfpm_arch: aarch64
    outputs:
      run-id: ${{ steps.expose-run-id.outputs.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for arm64 cross-compilation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            sudo apt-get update
            sudo apt-get install -y \
              build-essential \
              pkg-config \
              gcc-aarch64-linux-gnu \
              g++-aarch64-linux-gnu \
              libglib2.0-dev:arm64 \
              libgtk-4-dev:arm64 \
              libadwaita-1-dev:arm64 \
              libssl-dev:arm64 \
              jq
          else
            sudo apt-get install -y \
              build-essential \
              pkg-config \
              libglib2.0-dev \
              libgtk-4-dev \
              libadwaita-1-dev \
              libssl-dev \
              jq
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Configure cross-compilation for arm64
        if: matrix.arch == 'arm64'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --workspace --release --target ${{ matrix.rust_target }}

      - name: Prepare for packaging
        run: |
          mkdir -p target/release
          cp target/${{ matrix.rust_target }}/release/actioneer target/release/actioneer

      - name: Prepare packaging metadata
        run: |
          VERSION=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name=="actioneer") | .version')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NFPM_ARCH=${{ matrix.nfpm_arch }}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build RPM package
        run: |
          mkdir -p dist
          ~/go/bin/nfpm package --config packaging/nfpm.yaml --packager rpm --target dist
          rpm_file=$(find dist -name '*.rpm' -print -quit)
          mv "$rpm_file" "dist/actioneer-${{ matrix.arch }}.rpm"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/actioneer-${{ matrix.arch }}.rpm
          compression-level: 0

      - name: Expose workflow run id
        id: expose-run-id
        run: echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"