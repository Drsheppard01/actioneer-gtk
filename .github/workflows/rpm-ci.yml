name: RPM Package CI

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      run-id:
        description: GitHub run id that produced the RPM package artifacts
        value: ${{ jobs.build.outputs.run-id }}

jobs:
  build:
    name: Build RPM (amd64 & arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            rust_target: x86_64-unknown-linux-gnu
            nfpm_arch: x86_64
          - arch: arm64
            platform: linux/arm64
            rust_target: aarch64-unknown-linux-gnu
            nfpm_arch: aarch64
    outputs:
      run-id: ${{ steps.expose-run-id.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: matrix.arch == 'arm64'
        uses: docker/setup-buildx-action@v3

      - name: Install system packages (native)
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-4-dev libadwaita-1-dev jq

      - name: Install Rust toolchain (native)
        if: matrix.arch == 'amd64'
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary (native)
        if: matrix.arch == 'amd64'
        run: |
          cargo build --workspace --release --verbose

      - name: Build release binary (arm64 via Docker)
        if: matrix.arch == 'arm64'
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v $PWD:/workspace \
            -w /workspace \
            ubuntu:24.04 bash -c "
              apt-get update && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential pkg-config libglib2.0-dev libgtk-4-dev \
                libadwaita-1-dev curl && \
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && \
              . \$HOME/.cargo/env && \
              cargo build --workspace --release --verbose
            "

      - name: Install cargo and jq (for metadata extraction)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            source $HOME/.cargo/env
          fi

      - name: Prepare packaging metadata
        run: |
          set -euo pipefail
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            source $HOME/.cargo/env
          fi
          VERSION=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name=="actioneer" ) | .version')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NFPM_ARCH=${{ matrix.nfpm_arch }}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Build RPM package
        run: |
          set -euo pipefail
          mkdir -p dist
          nfpm package --config packaging/nfpm.yaml --packager rpm --target dist
          rpm_file=$(find dist -name '*.rpm' -print -quit)
          mv "$rpm_file" "dist/actioneer-${{ matrix.arch }}.rpm"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/actioneer-${{ matrix.arch }}.rpm
          compression-level: 0

      - name: Expose workflow run id
        id: expose-run-id
        run: echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
