name: RPM Package CI

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      run-id:
        description: GitHub run id that produced the RPM package artifacts
        value: ${{ jobs.build.outputs.run-id }}

jobs:
  build:
    name: Build RPM (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            nfpm_arch: x86_64
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            nfpm_arch: aarch64
    outputs:
      run-id: ${{ steps.expose-run-id.outputs.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- AMD64 Build Steps (run directly on host) ---
      - name: Install amd64 dependencies
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libssl-dev \
            jq

      - name: Install Rust toolchain (amd64)
        if: matrix.arch == 'amd64'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build release binary (amd64)
        if: matrix.arch == 'amd64'
        run: cargo build --workspace --release --target ${{ matrix.rust_target }}

      # --- ARM64 Build Steps (run inside a container) ---
      - name: Set up QEMU for arm64
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and package for arm64 in container
        if: matrix.arch == 'arm64'
        run: |
          docker run --rm --volume "./:/app" --workdir "/app" arm64v8/ubuntu:22.04 /bin/bash -c ' 
            set -e
            
            # 1. Install dependencies inside container
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y \
              build-essential \
              pkg-config \
              libglib2.0-dev \
              libgtk-4-dev \
              libadwaita-1-dev \
              libssl-dev \
              jq \
              curl \
              golang-go

            # 2. Install Rust inside container
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
            rustup target add aarch64-unknown-linux-gnu

            # 3. Configure linker for cross-compilation
            mkdir -p .cargo
            cat >> .cargo/config.toml << EOF
            [target.aarch64-unknown-linux-gnu]
            linker = "gcc"
            EOF

            # 4. Build release binary
            cargo build --workspace --release --target aarch64-unknown-linux-gnu

            # 5. Prepare for packaging
            mkdir -p target/release
            cp target/aarch64-unknown-linux-gnu/release/actioneer target/release/actioneer

            # 6. Prepare packaging metadata
            VERSION=$(cargo metadata --format-version 1 | jq -r ".packages[] | select(.name==\"actioneer\") | .version")
            export APP_VERSION=$VERSION
            export NFPM_ARCH=aarch64

            # 7. Build RPM package
            mkdir -p dist
            go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
            /root/go/bin/nfpm package --config packaging/nfpm.yaml --packager rpm --target dist
            
            # 8. Rename artifact
            rpm_file=$(find dist -name "*.rpm" -print -quit)
            mv "$rpm_file" "dist/actioneer-arm64.rpm"
          '

      # --- Common Steps ---
      - name: Prepare for packaging (amd64)
        if: matrix.arch == 'amd64'
        run: |
          mkdir -p target/release
          cp target/${{ matrix.rust_target }}/release/actioneer target/release/actioneer

      - name: Prepare packaging metadata
        run: |
          VERSION=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name=="actioneer" ) | .version')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NFPM_ARCH=${{ matrix.nfpm_arch }}" >> "$GITHUB_ENV"

      - name: Set up Go
        if: matrix.arch == 'amd64'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install nfpm
        if: matrix.arch == 'amd64'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build RPM package (amd64)
        if: matrix.arch == 'amd64'
        run: |
          mkdir -p dist
          ~/go/bin/nfpm package --config packaging/nfpm.yaml --packager rpm --target dist
          rpm_file=$(find dist -name '*.rpm' -print -quit)
          mv "$rpm_file" "dist/actioneer-${{ matrix.arch }}.rpm"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/actioneer-${{ matrix.arch }}.rpm
          compression-level: 0

      - name: Expose workflow run id
        id: expose-run-id
        run: echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
