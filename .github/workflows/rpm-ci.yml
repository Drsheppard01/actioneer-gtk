name: RPM Package CI

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      run-id:
        description: GitHub run id that produced the RPM package artifacts
        value: ${{ jobs.build.outputs.run-id }}

jobs:
  build:
    name: Build RPM (amd64 & arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            nfpm_arch: x86_64
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            nfpm_arch: aarch64
    outputs:
      run-id: ${{ steps.expose-run-id.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-4-dev libadwaita-1-dev libssl-dev jq

      - name: Install cross-compilation toolchain for arm64
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo dpkg --add-architecture arm64
          # Restrict all existing repos to amd64 only (both main file and sources.list.d)
          sudo sed -i 's/^deb \(http\|https\)/deb [arch=amd64] \1/g' /etc/apt/sources.list
          sudo sed -i 's/^deb-src \(http\|https\)/deb-src [arch=amd64] \1/g' /etc/apt/sources.list
          sudo find /etc/apt/sources.list.d/ -name "*.list" -exec sed -i 's/^deb \(http\|https\)/deb [arch=amd64] \1/g' {} \;
          sudo find /etc/apt/sources.list.d/ -name "*.list" -exec sed -i 's/^deb-src \(http\|https\)/deb-src [arch=amd64] \1/g' {} \;
          # Add arm64 ports repository
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main universe" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main universe" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-security main universe" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev:arm64 \
            libgtk-4-dev:arm64 \
            libadwaita-1-dev:arm64 \
            libssl-dev:arm64 \
            libpango1.0-dev:arm64 \
            libcairo2-dev:arm64 \
            libgdk-pixbuf2.0-dev:arm64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Configure cross-compilation
        if: matrix.arch == 'arm64'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
          # Set up PKG_CONFIG environment for cross-compilation
          export PKG_CONFIG_PATH="/usr/lib/aarch64-linux-gnu/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="/"
          export PKG_CONFIG_ALLOW_CROSS=1

      - name: Build release binary
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
        run: |
          cargo build --workspace --release --target ${{ matrix.rust_target }} --verbose

      - name: Copy binary to expected location
        run: |
          mkdir -p target/release
          cp target/${{ matrix.rust_target }}/release/actioneer target/release/actioneer

      - name: Prepare packaging metadata
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name=="actioneer" ) | .version')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NFPM_ARCH=${{ matrix.nfpm_arch }}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build RPM package
        run: |
          set -euo pipefail
          mkdir -p dist
          nfpm package --config packaging/nfpm.yaml --packager rpm --target dist
          rpm_file=$(find dist -name '*.rpm' -print -quit)
          mv "$rpm_file" "dist/actioneer-${{ matrix.arch }}.rpm"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/actioneer-${{ matrix.arch }}.rpm
          compression-level: 0

      - name: Expose workflow run id
        id: expose-run-id
        run: echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
