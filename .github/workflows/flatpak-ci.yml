name: Flatpak CI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Flatpak (CI)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain for vendoring
        shell: bash
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Vendor Rust dependencies
        shell: bash
        run: |
          rm -rf vendor
          cargo vendor --locked --versioned-dirs vendor

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/me.spaceinbox.actioneer.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          build-bundle: false
          upload-artifact: false
          run-tests: true

      # NOTE: It's recommended to run the flathub linter and/or push a PR to flathub to use the
      # Flathub builders for final validation. This workflow is a starter template; adjust to
      # your CI policies and secrets as needed.
