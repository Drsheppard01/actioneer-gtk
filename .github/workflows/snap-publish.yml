name: Snap Publish

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-publish:
    name: Build and publish snap (amd64 & arm64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (GTK & build deps)
        run: |
          sudo apt-get update
          # Match the CI environment: GTK4 and libadwaita dev libs are required to build the native parts
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-4-dev libadwaita-1-dev

      - name: Install snapcraft
        run: |
          # Install snapd and snapcraft. snapcraft is shipped as a snap.
          sudo apt-get install -y snapd
          sudo snap install snapcraft --classic

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Cache cargo (target + registry)
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.arch }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build for amd64 locally
        if: matrix.arch == 'amd64'
        run: |
          cargo build --workspace --release --verbose
          # Build the snap locally for the current arch
          snapcraft --destructive-mode --destructive-unpack

      - name: Trigger remote build for arm64
        if: matrix.arch == 'arm64'
        run: |
          # Use snapcraft remote-build to build for arm64 (Launchpad)
          # This will queue a build and download the resulting snap when finished.
          snapcraft remote-build --arch=arm64 . || true
          # remote-build may print the resulting .snap path; try to find it
          ls -la || true

      - name: Find generated snap
        id: find-snap
        run: |
          # try to locate any built .snap in the workspace (search recursively)
          set -e
          SNAP_FILE=$(find . -type f -name "*.snap" | head -n1 || true)
          if [ -z "$SNAP_FILE" ]; then
            echo "No .snap produced in the workspace."
            echo "snap_file=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Found snap: $SNAP_FILE"
          echo "snap_file=$SNAP_FILE" >> $GITHUB_OUTPUT

      - name: Login to Snapcraft (supports credential file or expect fallback)
        if: steps.find-snap.outputs.snap_file != ''
        env:
          SNAPCRAFT_EMAIL: ${{ secrets.SNAPCRAFT_EMAIL }}
          SNAPCRAFT_PASSWORD: ${{ secrets.SNAPCRAFT_PASSWORD }}
          SNAPCRAFT_CREDENTIALS: ${{ secrets.SNAPCRAFT_CREDENTIALS }}
        run: |
          # Prefer a pre-exported credential file (safe to store as secret). If present, write it and import.
          if [ -n "$SNAPCRAFT_CREDENTIALS" ]; then
            echo "$SNAPCRAFT_CREDENTIALS" > $HOME/snapcraft.credentials
            snapcraft login --with $HOME/snapcraft.credentials || true
            exit 0
          fi

          # Otherwise try a non-interactive login using expect to feed prompts.
          if [ -z "$SNAPCRAFT_EMAIL" ] || [ -z "$SNAPCRAFT_PASSWORD" ]; then
            echo "SNAPCRAFT_EMAIL or SNAPCRAFT_PASSWORD not set; cannot login"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y expect
          expect <<'EOF'
          set timeout -1
          spawn snapcraft login
          expect {
            -re "[Ee]mail:" {
              send "$env(SNAPCRAFT_EMAIL)\r"
              exp_continue
            }
            -re "[Pp]assword:" {
              send "$env(SNAPCRAFT_PASSWORD)\r"
            }
          }
          expect eof
EOF

      - name: Upload snap to Snap Store
        if: steps.find-snap.outputs.snap_file != ''
        run: |
          SNAP_FILE=${{ steps.find-snap.outputs.snap_file }}
          if [ -z "$SNAP_FILE" ]; then
            echo "No snap file to upload"
            exit 0
          fi
          echo "Uploading $SNAP_FILE to snapcraft..."
          # Push to the Snap Store and release to edge channel by default. Adjust channel as needed.
          # Prefer 'snapcraft upload' (newer) and fallback to 'snapcraft push'.
          snapcraft upload "$SNAP_FILE" --release edge || snapcraft push "$SNAP_FILE" --release edge

      - name: Upload snap as workflow artifact
        if: steps.find-snap.outputs.snap_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: built-snap-${{ matrix.arch }}
          path: ${{ steps.find-snap.outputs.snap_file }}
