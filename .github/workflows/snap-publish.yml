name: Snap Publish

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-publish:
    name: Build and publish snap (amd64 & arm64)
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            # Use the arm64 hosted runner label. Adjust this label if your organization uses a different one.
            runs-on: ubuntu-24.04-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (GTK & build deps)
        run: |
          sudo apt-get update
          # Match the CI environment: GTK4 and libadwaita dev libs are required to build the native parts
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-4-dev libadwaita-1-dev

      - name: Install snapcraft
        run: |
          # Install snapd and snapcraft. snapcraft is shipped as a snap.
          sudo apt-get install -y snapd
          sudo snap install snapcraft --classic

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Cache cargo (target + registry)
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.runs-on }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.arch }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build project and create snap
        run: |
          echo "Building for arch=${{ matrix.arch }} on runner=${{ matrix.runs-on }}"
          cargo build --workspace --release --verbose
          # Build the snap locally for the current runner architecture
          snapcraft --destructive-mode --destructive-unpack

      - name: Find generated snap
        id: find-snap
        run: |
          # try to locate any built .snap in the workspace (search recursively)
          set -e
          SNAP_FILE=$(find . -type f -name "*.snap" | head -n1 || true)
          if [ -z "$SNAP_FILE" ]; then
            echo "No .snap produced in the workspace."
            echo "snap_file=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Found snap: $SNAP_FILE"
          echo "snap_file=$SNAP_FILE" >> $GITHUB_OUTPUT

      - name: Login to Snapcraft (credential-file only)
        if: steps.find-snap.outputs.snap_file != ''
        env:
          SNAPCRAFT_CREDENTIALS: ${{ secrets.SNAPCRAFT_CREDENTIALS }}
        run: |
          # Prefer a pre-exported credential file (most reliable for non-interactive CI).
          if [ -n "$SNAPCRAFT_CREDENTIALS" ]; then
            echo "$SNAPCRAFT_CREDENTIALS" > $HOME/snapcraft.credentials
            snapcraft login --with $HOME/snapcraft.credentials || true
          else
            echo "SNAPCRAFT_CREDENTIALS secret not provided; skipping snapcraft login. To enable upload, set the SNAPCRAFT_CREDENTIALS secret (exported via 'snapcraft export-login')."
          fi

      - name: Upload snap to Snap Store
        if: steps.find-snap.outputs.snap_file != ''
        run: |
          SNAP_FILE=${{ steps.find-snap.outputs.snap_file }}
          if [ -z "$SNAP_FILE" ]; then
            echo "No snap file to upload"
            exit 0
          fi
          echo "Uploading $SNAP_FILE to snapcraft..."
          # Push to the Snap Store and release to edge channel by default. Adjust channel as needed.
          # Prefer 'snapcraft upload' (newer) and fallback to 'snapcraft push'.
          snapcraft upload "$SNAP_FILE" --release edge || snapcraft push "$SNAP_FILE" --release edge

      - name: Upload snap as workflow artifact
        if: steps.find-snap.outputs.snap_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: built-snap-${{ matrix.arch }}
          path: ${{ steps.find-snap.outputs.snap_file }}
