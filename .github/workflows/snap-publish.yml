name: Snap Publish

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-publish:
    name: Build and publish snap (amd64 & arm64)
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            # Use the arm64 hosted runner label. Adjust this label if your organization uses a different one.
            runs-on: ubuntu-24.04-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (GTK & build deps)
        run: |
          sudo apt-get update
          # Match the CI environment: GTK4 and libadwaita dev libs are required to build the native parts
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-4-dev libadwaita-1-dev

      - name: Install snapcraft
        run: |
          # Install snapd and snapcraft. snapcraft is shipped as a snap.
          sudo apt-get install -y snapd
          sudo snap install snapcraft --classic

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Cache cargo (target + registry)
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.runs-on }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.arch }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build project and create snap (build -> prime -> pack)
        run: |
          echo "Building for arch=${{ matrix.arch }} on runner=${{ matrix.runs-on }}"
          cargo build --workspace --release --verbose
          # Run snapcraft from the snap/ subdirectory where the snapcraft.yaml lives.
          # This ensures snapcraft can find the snap/snapcraft.yaml and will create
          # the expected meta/ files under prime/meta.
          pushd snap
          snapcraft --destructive-mode build
          snapcraft --destructive-mode prime
          mkdir -p snap-output
          # Show prime contents for debugging (helps diagnose missing meta/snap.yaml)
          echo "Prime directory listing:" && ls -la prime || true
          echo "Prime/meta listing:" && ls -la prime/meta || true
          # Pack from inside the prime directory. Packing expects a meta/ directory
          # inside the directory passed to `pack`.
          (cd prime && snapcraft --destructive-mode pack . -o ../snap-output)
          popd

      - name: Find generated snap
        id: find-snap
        run: |
          # Look specifically in snap/snap-output/ first (we run snapcraft in snap/)
          set -e
          SNAP_FILE=$(find snap/snap-output -type f -name "*.snap" | head -n1 || true)
          if [ -z "$SNAP_FILE" ]; then
            # Then check top-level snap-output/ (in case older runs used that)
            SNAP_FILE=$(find snap-output -type f -name "*.snap" | head -n1 || true)
          fi
          if [ -z "$SNAP_FILE" ]; then
            # Fallback: search the repo for any .snap
            SNAP_FILE=$(find . -type f -name "*.snap" | head -n1 || true)
          fi
          if [ -z "$SNAP_FILE" ]; then
            echo "No .snap produced in the workspace."
            echo "snap_file=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Found snap: $SNAP_FILE"
          echo "snap_file=$SNAP_FILE" >> $GITHUB_OUTPUT

      - name: Prepare Snapcraft credentials (via SNAPCRAFT_STORE_CREDENTIALS)
        if: steps.find-snap.outputs.snap_file != ''
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_CREDENTIALS }}
        run: |
          # The official docs recommend providing the exported credentials file contents
          # in the SNAPCRAFT_STORE_CREDENTIALS environment variable. That avoids writing a file.
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "SNAPCRAFT_CREDENTIALS secret not provided; upload steps will be skipped."
            exit 0
          fi
          echo "Verifying snapcraft credentials..."
          # whoami will succeed if the credentials are valid in the env
          snapcraft whoami || (echo "snapcraft whoami failed; credentials may be invalid" && exit 1)

      - name: Upload snap to Snap Store
        if: steps.find-snap.outputs.snap_file != '' && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_CREDENTIALS }}
        run: |
          SNAP_FILE=${{ steps.find-snap.outputs.snap_file }}
          if [ -z "$SNAP_FILE" ]; then
            echo "No snap file to upload"
            exit 0
          fi
          echo "Uploading $SNAP_FILE to snapcraft..."
          # snapcraft will use SNAPCRAFT_STORE_CREDENTIALS to authenticate non-interactively
          snapcraft upload "$SNAP_FILE" --release edge || snapcraft push "$SNAP_FILE" --release edge

      - name: Upload snap as workflow artifact
        if: steps.find-snap.outputs.snap_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: built-snap-${{ matrix.arch }}
          path: ${{ steps.find-snap.outputs.snap_file }}
