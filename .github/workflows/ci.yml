name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages (GTK4 & libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libglib2.0-dev pkg-config build-essential
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cache cargo registry and index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Install rustfmt and clippy
        run: |
          rustup component add clippy rustfmt
      - name: Run rustfmt
        run: cargo fmt -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: fmt-clippy
    strategy:
      matrix:
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages (GTK4 & libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libglib2.0-dev pkg-config build-essential
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          profile: minimal
      - name: Cache cargo (target + registry)
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-
      - name: Cargo build (debug)
        run: cargo build --workspace --all-targets --verbose
      - name: Cargo test (unit)
        run: cargo test --workspace --verbose
      - name: Cargo build (release)
        run: cargo build --workspace --release --verbose
      # Upload build artifacts (commented out for now, enable later)
      # - name: Upload build artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: actioneer-binaries
      #     path: |
      #       target/release/actioneer
      #       target/debug/actioneer

  ui-integration:
    name: UI / integration tests (optional)
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages (GUI deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libglib2.0-dev pkg-config xvfb libx11-dev
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      - name: Cache cargo (target + registry)
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}-ui
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: Start Xvfb and run ignored UI tests
        run: |
          sudo Xvfb :99 -screen 0 1920x1080x24 & export DISPLAY=:99
          sleep 2
          cargo test -- --ignored
      # Upload UI test logs (commented out for now)
      # - name: Upload UI test logs
      #   if: failure()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ui-test-logs
      #     path: ./target/debug/*.log

  release-artifact:
    name: Build Release artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libglib2.0-dev pkg-config build-essential
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Cargo build release
        run: cargo build --workspace --release --verbose
      # Upload release artifact (commented out for now)
      # - name: Upload release artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: actioneer-release
      #     path: target/release/actioneer
