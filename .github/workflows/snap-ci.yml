---
name: Snap CI

"on":
  workflow_dispatch:
  workflow_call:
    outputs:
      run-id:
        description: GitHub run id that produced the Snap artifacts
        value: ${{ jobs.build.outputs.run-id }}

jobs:
  build:
    name: Build snap (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    outputs:
      run-id: ${{ steps.expose-run-id.outputs.run_id }}

    steps:
      - uses: actions/checkout@v4

      # Enable qemu and register arm64 multiarch on the runner so apt can resolve :arm64 packages
      - name: Enable qemu and add arm64 architecture (for cross-build)
        if: matrix.platform == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo dpkg --add-architecture arm64

      - name: Build snap for ${{ matrix.platform }}
        uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-args: --build-for=${{ matrix.platform }}

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.platform }}
          path: ${{ steps.build.outputs.snap }}
          compression-level: 0

      - name: Expose workflow run id
        id: expose-run-id
        run: echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      # - name: Publish to store
      #   uses: snapcore/action-publish@v1
