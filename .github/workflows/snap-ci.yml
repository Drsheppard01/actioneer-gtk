name: Snap CI

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      run-id:
        description: GitHub run id that produced the Snap artifacts
        value: ${{ jobs.build-and-publish.outputs.run-id }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-publish:
    name: Build snap (amd64 & arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
    outputs:
      run-id: ${{ steps.expose-run-id.outputs.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (GTK & build deps)
        run: |
          sudo apt-get update
          # Match the CI environment: GTK4 and libadwaita dev libs are required to build the native parts
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-4-dev libadwaita-1-dev

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          target: ${{ matrix.rust_target }}

      - name: Install cross
        run: |
          set -euo pipefail
          cargo install cross --locked

      - name: Cache cargo (target + registry)
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.arch }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust release
        run: |
          set -euo pipefail
          echo "Building for arch=${{ matrix.arch }} with target=${{ matrix.rust_target }}"
          cross build --workspace --release --target ${{ matrix.rust_target }} --verbose

      - name: Snap pack
        uses: snapcore/action-build@v1
        id: build
        env:
          SNAPCRAFT_BUILD_FOR: ${{ matrix.arch }}
          CARGO_BUILD_TARGET: ${{ matrix.rust_target }}
        with:
          snapcraft-args: --destructive-mode
      # - name: Publish to store
      #   uses: snapcore/action-publish@v1
      #   env:
      #     SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_CREDENTIALS }}
      #   with:
      #     snap: ${{ steps.build.outputs.snap }}
      #     release: stable

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          compression-level: 0

      - name: Expose workflow run id
        id: expose-run-id
        run: echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
