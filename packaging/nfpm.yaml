name: actioneer
arch: "{{ .Env.NFPM_ARCH }}"
platform: linux
version: "{{ .Env.APP_VERSION }}"
section: utils
priority: extra
maintainer: Sergey Armodin <sergey@armodin.dev>
description: |
  GitHub Actions client for Linux (GNOME)
license: MIT
homepage: https://github.com/makoni/Actioneer-gtk
depends:
  - libgtk-4-1
  - libadwaita-1-0
  - libglib2.0-0
contents:
  - src: target/release/actioneer
    dst: /usr/bin/actioneer
  - src: data/me.spaceinbox.actioneer.desktop
    dst: /usr/share/applications/me.spaceinbox.actioneer.desktop
  - src: data/me.spaceinbox.actioneer.service
    dst: /usr/share/dbus-1/services/me.spaceinbox.actioneer.service
  - src: data/metainfo.xml
    dst: /usr/share/metainfo/me.spaceinbox.actioneer.metainfo.xml
  - src: icons/icons/hicolor
    dst: /usr/share/icons/hicolor
    type: dir
  - src: LICENSE
    dst: /usr/share/licenses/actioneer/LICENSE
rpm:
deb:
